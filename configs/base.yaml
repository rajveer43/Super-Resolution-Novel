# Base configuration. Dataset files in configs/data/*.yaml, experiment presets in configs/experiments/.
seed: 42
device: auto          # auto -> cuda, then mps (Apple GPU), then cpu
out_dir: runs
exp_name: default

data:
  name: calochallenge
  files: []
  split: {train: 0.8, val: 0.1, test: 0.1}
  max_events: null    # cap the number of events (laptop-friendly); null = all
  lr_factors: [4]     # nominal LR factors; one is drawn per training batch (multi-ladder training)
  factor_overrides: null
  batch_size: 16
  num_workers: 0
  energy_scale: 1.0   # E_scale in log1p(E / E_scale)

model:
  d_model: 128
  heads: 4
  enc_layers: 4
  dec_layers: 4
  mlp_ratio: 4
  dropout: 0.0
  window: 1024              # tokens per local-attention window (Morton order)
  pos_encoding: rope        # rope | absolute (ablation)
  rope: {max_freq: 256, periodic_max_freq: 64, depth_max_freq: 16}
  abs_level_feature: true
  max_children: 16
  zero_token_frac: 0.02
  max_enc_tokens: 2048
  max_enc_tokens_eval: 8192
  max_parents_train: 3072
  generator: flow           # flow | regression (ablation)
  ladder: next_scale        # next_scale | one_shot (ablation)
  conservation: true        # energy-conserving child split (ablation: false)
  use_occupancy: true
  occ_mode: sample          # sample | threshold (occupancy at inference; threshold biases the number of zeros)
  occ_threshold: 0.5        # used only when occ_mode=threshold
  above_native_occupancy: keep   # keep | sample: above native resolution keep every sub-cell (smooth split)
  flow: {mixer_layers: 1, y_std: 3.0, eps: 1.0e-4, sigma_min: 1.0e-4, nfe: 16, solver: midpoint}
  conditioning: {incident_energy: false, particle: false, e_min: 1000.0, e_max: 1000000.0}

loss:
  occ: 1.0
  profile: 0.5
  jepa: 0.05
  jepa_max_parents: 256

jepa:
  epochs: 30                 # the previous 15-epoch run was still improving fast when it stopped
  lr: 2.0e-4                # 5e-4 was unstable right after warmup and left a long noisy plateau
  warmup_frac: 0.05         # of all steps; keep it >= 1 epoch
  decay_frac: 0.4           # share of the steps in the final linear LR decay (most of the gain came from it)
  batch_size: 16
  ema: [0.996, 1.0]
  n_blocks: 4
  block_scale: [0.1, 0.3]
  cross_scale: true
  cross_weight: 1.0
  max_hr_tokens: 2048
  n_hr_queries: 256
  d_pred: 96
  pred_heads: 4
  pred_layers: 3
  progressive_factors: null   # e.g. [[8], [4, 8]]: coarse factors first, finer ones later (V-JEPA 2)

train:
  epochs: 10
  lr: 3.0e-4
  weight_decay: 0.05
  warmup_frac: 0.05
  schedule: cosine          # cosine | wcd (warmup-constant-decay)
  grad_clip: 1.0
  max_steps_per_epoch: null
  freeze_encoder_epochs: 1
  encoder_lr_mult: 0.2
  log_every: 20
  pretrained_encoder: auto  # auto -> runs/<exp>/jepa/encoder.pt if it exists; null to disable
  select_events: 0          # > 0: pick best.pt by the mean separation power of this many validation showers (lower is better)
  select_bins: 20           # histogram bins of that metric (few, because only a few hundred showers are used)

# CaloChallenge Dataset 2 evaluation (scripts/evaluate.py); also lr_factors is read by scripts/super_resolve.py
eval:
  lr_factors: [4]
  n_events: null              # null = the whole test split (100 000 Geant4 showers in dataset_2_2)
  batch_size: 16              # generation batch size
  nfe: 16
  solver: midpoint
  baselines: [nearest, bicubic]
  threshold_mev: 0.01515      # voxel activity threshold for the sparsity: Par04 stores nothing below 0.5 keV = 0.5 keV / 0.033 = 15.15 keV (challenge paper, sec. 2.2)
  n_bins: 50                  # histogram bins of the separation power
  band_pairs: 10              # random Geant4 half-splits for the grey band / floors
  kpd_batch: 10000
  manifold: {events: 10000, k: 5}
  classifier:                 # binary classifier test, sizes as in the challenge
    run: [dnn_low, dnn_high, cnn_low]
    seeds: 10
    dnn_epochs: 50
    cnn_epochs: 48
    dnn_lr: 2.0e-4
    cnn_lr: 2.5e-5
    dnn_batch: 1000
    cnn_batch: 256
  timing: {batch_sizes: [1, 100], events: 200}
  beyond_native:              # scripts/beyond_native.py: consistency checks above the native 16 x 9 grid
    sizes: [256, 512, 1024, 2048]   # Cartesian N x N images (x = eta, y = phi); add 4096 ... as memory allows
    n_events: 8
    samples: 4                # sub-sample points per axis when resampling polar cells onto pixels
    factor: null              # null = eval.lr_factors[0]
    images: 2                 # sample images (ladder + zoom) for the first N showers
    zoom_mm: 10.0             # half-width of the zoom window around the centre of energy
